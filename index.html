<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Диплом дружбы 💕</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;700&family=Pacifico&family=Montserrat:wght@400;700;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Comfortaa', cursive;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #a18cd1 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            overflow-x: hidden;
            animation: bgShift 8s ease-in-out infinite;
        }
        @keyframes bgShift {
            0%,100% { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #a18cd1 100%); }
            50% { background: linear-gradient(135deg, #a18cd1 0%, #ff9a9e 50%, #fecfef 100%); }
        }
        .hearts-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .heart { position: absolute; animation: fall linear infinite; opacity: 0.8; }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg) scale(0); opacity: 0; }
            10% { opacity: 0.8; transform: scale(1); }
            90% { opacity: 0.8; }
            100% { transform: translateY(110vh) rotate(720deg) scale(0.5); opacity: 0; }
        }
        .diploma-container { position: relative; z-index: 1; width: 100%; max-width: 440px; animation: floatIn 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes floatIn {
            0% { opacity: 0; transform: scale(0.3) translateY(100px) rotate(-10deg); }
            60% { transform: scale(1.05) translateY(-10px) rotate(2deg); }
            100% { opacity: 1; transform: scale(1) translateY(0) rotate(0); }
        }
        .diploma-border {
            background: linear-gradient(135deg, #ffd700 0%, #ff6b9d 25%, #ffd700 50%, #c084fc 75%, #ffd700 100%);
            background-size: 400% 400%;
            padding: 5px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(255,107,157,0.4), 0 0 80px rgba(255,215,0,0.3);
            animation: borderGlow 3s ease-in-out infinite, borderShift 5s linear infinite;
        }
        @keyframes borderGlow {
            0%,100% { box-shadow: 0 20px 60px rgba(255,107,157,0.4), 0 0 80px rgba(255,215,0,0.3); }
            50% { box-shadow: 0 20px 80px rgba(255,107,157,0.6), 0 0 120px rgba(255,215,0,0.5); }
        }
        @keyframes borderShift { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
        .diploma-inner {
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
            border-radius: 26px;
            padding: 20px 18px 25px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .stars-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .star-dot { position: absolute; background: white; border-radius: 50%; animation: twinkle 3s ease-in-out infinite; }
        @keyframes twinkle { 0%,100% { opacity: 0.2; } 50% { opacity: 1; } }
        .crown-icon { font-size: 60px; animation: crownBounce 1s ease-in-out infinite; display: inline-block; }
        @keyframes crownBounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        .diploma-title { font-family: 'Pacifico', cursive; font-size: 24px; color: #ffd700; text-shadow: 0 0 20px rgba(255,215,0,0.5); margin: 8px 0 3px; }
        .diploma-subtitle { font-family: 'Montserrat', sans-serif; font-size: 11px; color: #ff6b9d; letter-spacing: 4px; margin-bottom: 15px; }
        .divider { width: 80%; height: 1px; background: linear-gradient(90deg, transparent, #ff6b9d, #ffd700, #c084fc, transparent); margin: 0 auto 15px; }
        .award-text { font-size: 16px; color: #c4b5fd; margin-bottom: 3px; }
        .friend-name { font-family: 'Pacifico', cursive; font-size: 38px; color: #fff; text-shadow: 0 0 30px rgba(255,107,157,0.8); margin: 8px 0; }
        .knows-text { font-size: 15px; color: #94a3b8; }
        .creator-name { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 24px; color: #ff6b9d; margin: 5px 0 12px; }
        .score-container { position: relative; width: 150px; height: 150px; margin: 15px auto; }
        .score-circle {
            width: 100%; height: 100%; border-radius: 50%;
            background: conic-gradient(#ffd700 0deg, #ff6b9d calc(var(--sd)*1deg), #c084fc calc(var(--sd)*1deg), #2a2a4a calc(var(--sd)*1deg));
            display: flex; align-items: center; justify-content: center;
        }
        .score-inner { width: 120px; height: 120px; border-radius: 50%; background: #1a1a2e; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        .score-number { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 48px; background: linear-gradient(135deg, #ffd700, #ff6b9d); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .score-percent { font-size: 18px; color: #ffd700; font-weight: 700; }
        .status-badge {
            display: inline-block;
            background: rgba(255,107,157,0.2); border: 2px solid rgba(255,215,0,0.4); border-radius: 30px;
            padding: 10px 25px; font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 15px;
            color: #ffd700; margin: 12px 0;
        }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 15px 0; text-align: left; }
        .stat-item { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 12px; }
        .stat-emoji { font-size: 28px; margin-bottom: 4px; }
        .stat-label { font-size: 10px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 20px; color: #fff; }
        .prediction-box { background: rgba(192,132,252,0.08); border: 1px solid rgba(192,132,252,0.2); border-radius: 20px; padding: 15px; margin: 12px 0; }
        .prediction-title { font-size: 13px; color: #c084fc; letter-spacing: 2px; margin-bottom: 8px; }
        .prediction-text { font-size: 14px; color: #e2e8f0; line-height: 1.7; }
        .cert-number { font-size: 10px; color: #64748b; letter-spacing: 3px; margin-top: 12px; }
        .footer-text { font-size: 12px; color: #ff6b9d; margin-top: 3px; }
        .share-btn {
            display: inline-block;
            background: linear-gradient(135deg, #ff6b9d, #c084fc);
            color: white; border: none; border-radius: 25px;
            padding: 12px 30px; font-family: 'Montserrat', sans-serif;
            font-size: 16px; font-weight: 700; cursor: pointer;
            margin-top: 15px; box-shadow: 0 5px 20px rgba(255,107,157,0.4);
        }
        .share-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <div class="hearts-container" id="hearts"></div>
    <div class="diploma-container">
        <div class="diploma-border">
            <div class="diploma-inner">
                <div class="stars-bg" id="stars"></div>
                <div class="crown-icon">👑</div>
                <div class="diploma-title">СЕРТИФИКАТ ДРУЖБЫ</div>
                <div class="diploma-subtitle">💕 официальный документ 💕</div>
                <div class="divider"></div>
                <div class="award-text">🌸 Этот сертификат подтверждает, что</div>
                <div class="friend-name" id="friendName">Подруга</div>
                <div class="knows-text">✨ знает ✨</div>
                <div class="creator-name" id="creatorName">Создатель</div>
                <div class="knows-text">на</div>
                <div class="score-container">
                    <div class="score-circle" id="scoreCircle">
                        <div class="score-inner">
                            <div class="score-number" id="scoreNumber">85</div>
                            <div class="score-percent">%</div>
                        </div>
                    </div>
                </div>
                <div class="status-badge" id="statusBadge">👯 ЛУЧШИЕ ПОДРУГИ</div>
                <div class="stats-grid">
                    <div class="stat-item"><div class="stat-emoji">📝</div><div class="stat-label">Вопросов</div><div class="stat-value" id="totalQuestions">10</div></div>
                    <div class="stat-item"><div class="stat-emoji">✅</div><div class="stat-label">Правильно</div><div class="stat-value" id="correctAnswers">8</div></div>
                    <div class="stat-item"><div class="stat-emoji">🏆</div><div class="stat-label">Уровень</div><div class="stat-value" id="levelText">ПРОФИ</div></div>
                    <div class="stat-item"><div class="stat-emoji">⭐</div><div class="stat-label">Рейтинг</div><div class="stat-value" id="ratingStars">★★★★☆</div></div>
                </div>
                <div class="prediction-box">
                    <div class="prediction-title">🔮 ПРЕДСКАЗАНИЕ ДРУЖБЫ</div>
                    <div class="prediction-text" id="predictionText">Вы отличные подруги! 💕</div>
                </div>
                <div class="divider"></div>
                <button class="share-btn" onclick="shareDiploma()">📤 ПОДЕЛИТЬСЯ ДИПЛОМОМ</button>
                <div class="cert-number" id="certNumber">#DF000000</div>
                <div class="footer-text">💕 podrugatestbot 💕</div>
            </div>
        </div>
    </div>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        tg.setHeaderColor('#1a1a2e');

        function decodeParam(p) { try { return decodeURIComponent(p||''); } catch(e) { return p; } }

        const params = new URLSearchParams(window.location.search);
        const score = parseInt(params.get('score'))||0;
        const friendName = decodeParam(params.get('friend'))||'Подруга';
        const creatorName = decodeParam(params.get('creator'))||'Создатель';
        const totalQuestions = parseInt(params.get('total'))||10;
        const correctAnswers = parseInt(params.get('correct'))||0;
        const status = decodeParam(params.get('status'))||'ПОДРУГИ';
        const prediction = decodeParam(params.get('prediction'))||'Вы отличные подруги!';
        const testId = params.get('test_id')||'0';

        document.getElementById('friendName').textContent = friendName;
        document.getElementById('creatorName').textContent = creatorName;
        document.getElementById('scoreNumber').textContent = score;
        document.getElementById('totalQuestions').textContent = totalQuestions;
        document.getElementById('correctAnswers').textContent = correctAnswers;
        document.getElementById('statusBadge').textContent = status;
        document.getElementById('predictionText').textContent = prediction;
        document.getElementById('levelText').textContent = score>=90?'ЭКСПЕРТ 👑':score>=70?'ПРОФИ 💎':score>=50?'ЗНАЕТ 🌸':score>=30?'УЧИТСЯ 🌱':'НОВИЧОК 🦋';
        document.getElementById('ratingStars').textContent='★'.repeat(score>=90?5:score>=70?4:score>=50?3:score>=30?2:1)+'☆'.repeat(score>=90?0:score>=70?1:score>=50?2:score>=30?3:4);
        document.getElementById('certNumber').textContent='#DF'+Date.now().toString(36).toUpperCase().slice(-8);
        document.getElementById('scoreCircle').style.setProperty('--sd',score*3.6);

        // Эмодзи
        const emojis=['💕','💖','💗','💝','✨','💫','🌸','🦋','💎','👑','🎀','💐','🌟','💞','🎉'];
        const container=document.getElementById('hearts');
        for(let i=0;i<40;i++){const h=document.createElement('span');h.className='heart';h.textContent=emojis[Math.floor(Math.random()*emojis.length)];h.style.left=Math.random()*100+'%';h.style.fontSize=(18+Math.random()*30)+'px';h.style.animationDuration=(4+Math.random()*8)+'s';h.style.animationDelay=Math.random()*8+'s';container.appendChild(h);}

        // Звёзды
        const sb=document.getElementById('stars');
        for(let i=0;i<60;i++){const s=document.createElement('div');s.className='star-dot';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.width=(1+Math.random()*3)+'px';s.style.height=s.style.width;s.style.animationDelay=Math.random()*3+'s';sb.appendChild(s);}

        // Конфетти
        if(score>=50){const colors=['#ffd700','#ff6b9d','#c084fc','#4ade80','#60a5fa','#fbbf24'];const st=document.createElement('style');st.textContent='@keyframes cf{0%{transform:translateY(0) rotate(0deg) scale(1);opacity:1}100%{transform:translateY(110vh) rotate(720deg) scale(0);opacity:0}}';document.head.appendChild(st);for(let i=0;i<80;i++){setTimeout(()=>{const c=document.createElement('div');c.style.cssText='position:fixed;top:-20px;left:'+Math.random()*100+'%;width:'+(6+Math.random()*10)+'px;height:'+(6+Math.random()*10)+'px;background:'+colors[Math.floor(Math.random()*colors.length)]+';border-radius:'+(Math.random()>0.5?'50%':'2px')+';z-index:999;animation:cf '+(2+Math.random()*3)+'s ease-in forwards;pointer-events:none';document.body.appendChild(c);setTimeout(()=>c.remove(),4000)},i*25)}}

        // Поделиться - отправляем данные боту
        function shareDiploma() {
            const shareText = `💕 Я прошла тест и получила диплом дружбы!\n👤 ${friendName} знает ${creatorName} на ${score}%\n🏆 Статус: ${status}\n\n🌟 Пройди и ты: https://t.me/PodrugaTestBot?start=test_${testId}`;
            tg.openTelegramLink(`https://t.me/share/url?url=https://t.me/PodrugaTestBot&text=${encodeURIComponent(shareText)}`);
        }
    </script>
</body>
</html>
