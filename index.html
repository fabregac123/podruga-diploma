<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Диплом дружбы 💕</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;700&family=Pacifico&family=Montserrat:wght@300;400;700;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Comfortaa', cursive;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            overflow-x: hidden;
        }
        .hearts-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .heart { position: absolute; font-size: 20px; animation: fall linear infinite; opacity: 0.7; }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.7; }
            90% { opacity: 0.7; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }
        .diploma-container { position: relative; z-index: 1; width: 100%; max-width: 420px; animation: floatIn 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes floatIn {
            0% { opacity: 0; transform: scale(0.3) translateY(100px); }
            60% { transform: scale(1.05) translateY(-10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .diploma-border {
            background: linear-gradient(135deg, #ffd700 0%, #ffaa00 25%, #ffd700 50%, #ffaa00 75%, #ffd700 100%);
            padding: 4px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(255, 107, 157, 0.4), 0 0 80px rgba(255, 215, 0, 0.3);
            animation: borderGlow 3s ease-in-out infinite;
        }
        @keyframes borderGlow {
            0%, 100% { box-shadow: 0 20px 60px rgba(255, 107, 157, 0.4), 0 0 80px rgba(255, 215, 0, 0.3); }
            50% { box-shadow: 0 20px 80px rgba(255, 107, 157, 0.6), 0 0 120px rgba(255, 215, 0, 0.5); }
        }
        .diploma-inner {
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
            border-radius: 26px;
            padding: 25px 20px 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .stars-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .star-dot { position: absolute; width: 2px; height: 2px; background: white; border-radius: 50%; animation: twinkle 3s ease-in-out infinite; }
        @keyframes twinkle { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
        .crown-icon { font-size: 50px; animation: crownBounce 1s ease-in-out infinite; display: inline-block; }
        @keyframes crownBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .diploma-title { font-family: 'Pacifico', cursive; font-size: 22px; color: #ffd700; text-shadow: 0 0 20px rgba(255, 215, 0, 0.5); margin: 10px 0 5px; }
        .diploma-subtitle { font-family: 'Montserrat', sans-serif; font-size: 10px; color: #ff6b9d; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 20px; }
        .divider { width: 80%; height: 1px; background: linear-gradient(90deg, transparent, #ff6b9d, #ffd700, #ff6b9d, transparent); margin: 0 auto 20px; }
        .award-text { font-family: 'Comfortaa', cursive; font-size: 14px; color: #c4b5fd; margin-bottom: 5px; }
        .friend-name { font-family: 'Pacifico', cursive; font-size: 36px; color: #fff; text-shadow: 0 0 30px rgba(255, 107, 157, 0.6); margin: 10px 0; }
        .knows-text { font-size: 13px; color: #94a3b8; }
        .creator-name { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 20px; color: #ff6b9d; margin: 5px 0 15px; }
        .score-container { position: relative; width: 140px; height: 140px; margin: 20px auto; }
        .score-circle {
            width: 100%; height: 100%; border-radius: 50%;
            background: conic-gradient(#ffd700 0deg, #ff6b9d calc(var(--score-deg) * 1deg), #2a2a4a calc(var(--score-deg) * 1deg));
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 40px rgba(255, 107, 157, 0.3);
        }
        .score-inner { width: 110px; height: 110px; border-radius: 50%; background: #1a1a2e; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        .score-number { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 42px; background: linear-gradient(135deg, #ffd700, #ff6b9d); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .score-percent { font-size: 16px; color: #ffd700; font-weight: 700; }
        .status-badge { display: inline-block; background: rgba(255, 107, 157, 0.2); border: 1px solid rgba(255, 215, 0, 0.3); border-radius: 25px; padding: 8px 20px; font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 13px; color: #ffd700; margin: 15px 0; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0; text-align: left; }
        .stat-item { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 15px; padding: 12px; }
        .stat-emoji { font-size: 24px; margin-bottom: 5px; }
        .stat-label { font-size: 10px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 18px; color: #fff; }
        .prediction-box { background: rgba(255, 107, 157, 0.08); border: 1px solid rgba(255, 107, 157, 0.2); border-radius: 20px; padding: 15px; margin: 15px 0; }
        .prediction-title { font-size: 12px; color: #ff6b9d; letter-spacing: 2px; margin-bottom: 8px; }
        .prediction-text { font-size: 13px; color: #e2e8f0; line-height: 1.6; font-style: italic; }
        .cert-number { font-size: 9px; color: #64748b; letter-spacing: 2px; margin-top: 15px; }
        .footer-text { font-size: 11px; color: #ff6b9d; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="hearts-container" id="hearts"></div>
    <div class="diploma-container">
        <div class="diploma-border">
            <div class="diploma-inner">
                <div class="stars-bg" id="stars"></div>
                <div class="crown-icon">👑</div>
                <div class="diploma-title">СЕРТИФИКАТ ДРУЖБЫ</div>
                <div class="diploma-subtitle">официальный документ</div>
                <div class="divider"></div>
                <div class="award-text">🌸 Этот сертификат подтверждает, что</div>
                <div class="friend-name" id="friendName">Подруга</div>
                <div class="knows-text">знает</div>
                <div class="creator-name" id="creatorName">Создатель</div>
                <div class="knows-text">на</div>
                <div class="score-container">
                    <div class="score-circle" id="scoreCircle">
                        <div class="score-inner">
                            <div class="score-number" id="scoreNumber">85</div>
                            <div class="score-percent">%</div>
                        </div>
                    </div>
                </div>
                <div class="status-badge" id="statusBadge">👯 ЛУЧШИЕ ПОДРУГИ</div>
                <div class="stats-grid">
                    <div class="stat-item"><div class="stat-emoji">📝</div><div class="stat-label">Вопросов</div><div class="stat-value" id="totalQuestions">10</div></div>
                    <div class="stat-item"><div class="stat-emoji">✅</div><div class="stat-label">Правильно</div><div class="stat-value" id="correctAnswers">8</div></div>
                    <div class="stat-item"><div class="stat-emoji">🏆</div><div class="stat-label">Уровень</div><div class="stat-value" id="levelText">ПРОФИ</div></div>
                    <div class="stat-item"><div class="stat-emoji">⭐</div><div class="stat-label">Рейтинг</div><div class="stat-value" id="ratingStars">★★★★☆</div></div>
                </div>
                <div class="prediction-box">
                    <div class="prediction-title">🔮 ПРЕДСКАЗАНИЕ ДРУЖБЫ</div>
                    <div class="prediction-text" id="predictionText">Вы отличные подруги!</div>
                </div>
                <div class="divider"></div>
                <div class="cert-number" id="certNumber">#DF000000</div>
                <div class="footer-text">podrugatestbot 💕</div>
            </div>
        </div>
    </div>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        tg.setHeaderColor('#1a1a2e');
        tg.setBackgroundColor('#ff9a9e');

        const params = new URLSearchParams(window.location.search);
        const score = parseInt(params.get('score')) || 0;
        const friendName = params.get('friend') || 'Подруга';
        const creatorName = params.get('creator') || 'Создатель';
        const totalQuestions = parseInt(params.get('total')) || 10;
        const correctAnswers = parseInt(params.get('correct')) || 0;
        const status = params.get('status') || 'ПОДРУГИ';
        const prediction = params.get('prediction') || 'Вы отличные подруги!';

        document.getElementById('friendName').textContent = friendName;
        document.getElementById('creatorName').textContent = creatorName;
        document.getElementById('scoreNumber').textContent = score;
        document.getElementById('totalQuestions').textContent = totalQuestions;
        document.getElementById('correctAnswers').textContent = correctAnswers;
        document.getElementById('statusBadge').textContent = status;
        document.getElementById('predictionText').textContent = prediction;
        
        const level = score >= 90 ? 'ЭКСПЕРТ 👑' : score >= 70 ? 'ПРОФИ 💎' : score >= 50 ? 'ЗНАЕТ 🌸' : score >= 30 ? 'УЧИТСЯ 🌱' : 'НОВИЧОК 🦋';
        document.getElementById('levelText').textContent = level;
        
        const stars = score >= 90 ? 5 : score >= 70 ? 4 : score >= 50 ? 3 : score >= 30 ? 2 : 1;
        document.getElementById('ratingStars').textContent = '★'.repeat(stars) + '☆'.repeat(5 - stars);
        
        document.getElementById('certNumber').textContent = '#DF' + Date.now().toString(36).toUpperCase().slice(-8);
        document.getElementById('scoreCircle').style.setProperty('--score-deg', score * 3.6);

        const heartsContainer = document.getElementById('hearts');
        const emojis = ['💕', '💖', '💗', '💝', '✨', '💫', '🌸', '🦋', '💎', '👑'];
        for (let i = 0; i < 30; i++) {
            const h = document.createElement('span');
            h.className = 'heart';
            h.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            h.style.left = Math.random() * 100 + '%';
            h.style.fontSize = (15 + Math.random() * 25) + 'px';
            h.style.animationDuration = (5 + Math.random() * 10) + 's';
            h.style.animationDelay = Math.random() * 10 + 's';
            heartsContainer.appendChild(h);
        }

        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 50; i++) {
            const s = document.createElement('div');
            s.className = 'star-dot';
            s.style.left = Math.random() * 100 + '%';
            s.style.top = Math.random() * 100 + '%';
            s.style.animationDelay = Math.random() * 3 + 's';
            starsContainer.appendChild(s);
        }

        if (score >= 70) {
            const colors = ['#ffd700', '#ff6b9d', '#c084fc', '#4ade80', '#60a5fa', '#fbbf24'];
            const style = document.createElement('style');
            style.textContent = '@keyframes cf { 0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; } 100% { transform: translateY(110vh) rotate(720deg) scale(0); opacity: 0; } }';
            document.head.appendChild(style);
            for (let i = 0; i < 60; i++) {
                setTimeout(() => {
                    const c = document.createElement('div');
                    c.style.cssText = `position:fixed;top:-20px;left:${Math.random()*100}%;width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;background:${colors[Math.floor(Math.random()*colors.length)]};border-radius:${Math.random()>0.5?'50%':'2px'};z-index:999;animation:cf ${2+Math.random()*3}s ease-in forwards;`;
                    document.body.appendChild(c);
                    setTimeout(() => c.remove(), 4000);
                }, i * 30);
            }
        }
    </script>
</body>
</html>
