<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплата 💎</title>
    <style>
        body {
            font-family: -apple-system, sans-serif;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; padding: 20px;
            background: linear-gradient(135deg, #ff9a9e, #fecfef);
        }
        .card {
            background: white; border-radius: 25px; padding: 30px;
            text-align: center; max-width: 350px; width: 100%;
            box-shadow: 0 20px 60px rgba(255,107,157,0.3);
        }
        .spinner {
            width: 50px; height: 50px; border: 4px solid #f0f0f0;
            border-top-color: #ff6b9d; border-radius: 50%;
            animation: spin 1s linear infinite; margin: 20px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .text { font-size: 16px; color: #666; margin: 15px 0; }
        .btn {
            display: block; width: 100%; background: #ff6b9d; color: white;
            border: none; border-radius: 15px; padding: 16px; font-size: 17px;
            font-weight: 700; cursor: pointer; margin: 15px 0; text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <div style="font-size:50px">💎</div>
        <div class="text">Открываем платёж...</div>
        <div class="spinner"></div>
        <a class="btn" id="payLink" href="#">Оплатить через СБП</a>
        <p style="font-size:12px;color:#999;">Если платёж не открылся — нажмите кнопку выше</p>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const price = parseInt(params.get('price')) || 0;
        const tariff = params.get('tariff') || '';
        const userId = params.get('user_id') || '0';
        
        // Прямая ссылка на СБП (Т-Банк, номер 89524330200)
        const sbpUrl = `https://qr.nspk.ru/transfer?bank=tinkoff&sum=${price}&cur=RUB&phone=89524330200&desc=Premium${tariff}_${userId}`;
        
        document.getElementById('payLink').href = sbpUrl;
        
        // Авто-редирект через 1.5 секунды
        setTimeout(() => { window.location.href = sbpUrl; }, 1500);
    </script>
</body>
</html>
