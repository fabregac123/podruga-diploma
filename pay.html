<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплата 💎</title>
    <style>
        body { 
            font-family: -apple-system, sans-serif;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; padding: 20px;
            background: linear-gradient(135deg, #ff9a9e, #fecfef);
        }
        .card {
            background: white; border-radius: 25px; padding: 30px 20px;
            text-align: center; max-width: 350px; width: 100%;
            box-shadow: 0 20px 60px rgba(255,107,157,0.3);
        }
        .price { font-size: 56px; font-weight: 900; color: #1a1a2e; }
        .btn {
            display: block; width: 100%; background: #6c5ce7; color: white;
            border: none; border-radius: 15px; padding: 18px; font-size: 18px;
            font-weight: 700; cursor: pointer; margin: 20px 0; text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <div style="font-size:50px">👑</div>
        <div class="price" id="price">--₽</div>
        <p style="color:#666">Premium доступ</p>
        <a class="btn" id="payBtn" href="#">💳 Оплатить через СБП</a>
        <p style="font-size:12px;color:#999;margin-top:15px;">
            Откроется приложение вашего банка
        </p>
        <a href="https://t.me/PodrugaTestBot" style="color:#999;font-size:14px;">← Назад в бот</a>
    </div>
    <script>
        const p = new URLSearchParams(location.search);
        const price = parseInt(p.get('price')) || 0;
        const tariff = p.get('tariff') || '';
        const uid = p.get('user_id') || '0';
        
        document.getElementById('price').textContent = price + '₽';
        
        // Прямая ссылка на оплату через СБП (универсальная)
        const url = `https://qr.nspk.ru/transfer?bank=tinkoff&sum=${price}&cur=RUB&phone=9524330200&desc=Premium_${tariff}_${uid}`;
        document.getElementById('payBtn').href = url;
        
        // Авто-редирект через 1 секунду
        setTimeout(() => { window.location.href = url; }, 1000);
    </script>
</body>
</html>
