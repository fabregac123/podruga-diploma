<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплата 💎</title>
    <style>
        body {
            font-family: -apple-system, sans-serif;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; padding: 20px;
            background: linear-gradient(135deg, #ff9a9e, #fecfef);
        }
        .card {
            background: white; border-radius: 25px; padding: 30px;
            text-align: center; max-width: 350px; width: 100%;
            box-shadow: 0 20px 60px rgba(255,107,157,0.3);
        }
        .btn {
            display: block; width: 100%; background: #ff6b9d; color: white;
            border: none; border-radius: 15px; padding: 18px; font-size: 18px;
            font-weight: 700; cursor: pointer; margin: 15px 0; text-decoration: none;
        }
        .green { background: #00b894; }
        .info { font-size: 14px; color: #666; line-height: 1.8; text-align: left; }
        .info b { color: #ff6b9d; }
    </style>
</head>
<body>
    <div class="card">
        <div style="font-size:50px">💎</div>
        <h2 style="color:#ff6b9d">Premium</h2>
        <p style="font-size:36px;font-weight:900;color:#1a1a2e" id="price">--₽</p>
        
        <a class="btn green" id="tbankLink" href="#">
            💳 Оплатить через Т-Банк
        </a>
        
        <p style="color:#999;font-size:13px;">или переведите вручную на номер:</p>
        <p style="font-size:24px;font-weight:700;color:#1a1a2e;user-select:all;cursor:pointer;" onclick="copyPhone()">
            8 952 433-02-00
        </p>
        <p style="font-size:14px;color:#666;">Сумма: <b id="amount">--₽</b></p>
        
        <a class="btn" href="https://t.me/PodrugaTestBot">
            ✅ Я оплатил(а)
        </a>
    </div>
    <script>
        const p = new URLSearchParams(location.search);
        const price = parseInt(p.get('price')) || 0;
        const tariff = p.get('tariff') || '';
        const uid = p.get('user_id') || '0';
        
        document.getElementById('price').textContent = price + '₽';
        document.getElementById('amount').textContent = price + '₽';
        
        // Прямая ссылка на перевод в Т-Банке
        document.getElementById('tbankLink').href = 
            `https://www.tbank.ru/transfer/?to=89524330200&sum=${price}&text=Premium_${tariff}_${uid}`;
        
        function copyPhone() {
            navigator.clipboard.writeText('89524330200');
            alert('✅ Номер скопирован!');
        }
    </script>
</body>
</html>
