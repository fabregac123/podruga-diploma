<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Оплата Premium 💎</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=Montserrat:wght@400;700;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Comfortaa', cursive;
            background: linear-gradient(135deg, #ff9a9e, #fecfef);
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 10px;
        }
        .container { width: 100%; max-width: 380px; }
        .card {
            background: white; border-radius: 30px; padding: 25px 20px; text-align: center;
            box-shadow: 0 20px 60px rgba(255,107,157,0.3);
        }
        .crown { font-size: 50px; }
        .title { font-family: 'Montserrat', sans-serif; font-size: 22px; font-weight: 900; color: #ff6b9d; margin: 10px 0; }
        .price { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 48px; color: #1a1a2e; margin: 15px 0; }
        .price span { font-size: 22px; }
        .tariff-name { font-size: 16px; color: #c084fc; margin-bottom: 20px; }
        .bank-btn {
            display: block; width: 100%;
            background: linear-gradient(135deg, #ff6b9d, #c084fc);
            color: white; border: none; border-radius: 15px;
            padding: 16px; font-size: 17px; font-weight: 700;
            cursor: pointer; margin: 15px 0; text-decoration: none;
        }
        .bank-btn:active { transform: scale(0.97); }
        .info-text { font-size: 13px; color: #666; margin: 15px 0; line-height: 1.6; text-align: left; }
        .back-link { color: #94a3b8; text-decoration: none; font-size: 14px; display: block; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="crown">👑</div>
            <div class="title">Premium</div>
            <div class="tariff-name" id="tariffName">Загрузка...</div>
            <div class="price" id="price">--<span>₽</span></div>
            
            <a class="bank-btn" id="sbpLink" href="#">💳 Оплатить через СБП</a>
            
            <p class="info-text">
                <b>📱 Как оплатить:</b><br>
                1. Нажми на кнопку выше 👆<br>
                2. Выбери свой банк<br>
                3. Подтверди платёж<br>
                4. Премиум активируется автоматически! ⚡<br><br>
                💡 Работает на iPhone и Android
            </p>
            
            <a href="https://t.me/PodrugaTestBot" class="back-link">← Вернуться в бот</a>
        </div>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const tariff = params.get('tariff') || 'test';
        const userId = params.get('user_id') || '0';
        const price = parseInt(params.get('price')) || 0;
        
        const names = {'24h': '📅 На 24 часа', 'week': '💎 На неделю', 'forever': '👑 Навсегда'};
        document.getElementById('tariffName').textContent = names[tariff] || 'Premium';
        document.getElementById('price').innerHTML = price + '<span>₽</span>';
        
        // Прямая ссылка СБП на Т-Банк (номер 9524330200)
        const sbpUrl = `https://qr.nspk.ru/transfer?bank=tinkoff&sum=${price}&cur=RUB&phone=9524330200&desc=Premium_${tariff}_${userId}`;
        document.getElementById('sbpLink').href = sbpUrl;
    </script>
</body>
</html>
