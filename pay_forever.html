<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>👑 Королева тестов — Навсегда</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=Pacifico&family=Montserrat:wght@400;700;900&display=swap');
        * { margin: 0; padding: 10px; box-sizing: border-box; }
        body {
            font-family: 'Comfortaa', cursive;
            background: #0a0a00;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            overflow-x: hidden;
        }
        .golden-rain { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .gold-drop { position: absolute; animation: goldFall 3s linear infinite; font-size: 16px; }
        @keyframes goldFall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        .container { position: relative; z-index: 1; width: 100%; max-width: 420px; }

        .card {
            background: linear-gradient(180deg, #1a1a0a 0%, #0f0f00 100%);
            border-radius: 30px;
            padding: 30px 20px;
            text-align: center;
            border: 3px solid #ffd700;
            box-shadow: 0 0 80px rgba(255,215,0,0.4), 0 0 160px rgba(255,215,0,0.2), 0 20px 60px rgba(255,170,0,0.3);
            animation: cardGlow 2s ease-in-out infinite;
        }
        @keyframes cardGlow {
            0%,100% { box-shadow: 0 0 80px rgba(255,215,0,0.4); border-color: #ffd700; }
            50% { box-shadow: 0 0 120px rgba(255,215,0,0.6), 0 0 200px rgba(255,215,0,0.3); border-color: #ffcc00; }
        }

        .crown-large { font-size: 70px; animation: crownFloat 2s ease-in-out infinite; }
        @keyframes crownFloat { 0%,100%{transform:translateY(0) rotate(-3deg)} 50%{transform:translateY(-15px) rotate(3deg)} }

        .badge {
            display: inline-block;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #000;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 3px;
            margin: 10px 0;
        }

        .title {
            font-family: 'Pacifico', cursive;
            font-size: 28px;
            color: #ffd700;
            text-shadow: 0 0 30px rgba(255,215,0,0.6);
            margin: 8px 0 3px;
        }
        .subtitle {
            font-size: 11px;
            color: #ffcc00;
            letter-spacing: 3px;
            margin-bottom: 15px;
        }
        .divider {
            width: 70%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ffd700, transparent);
            margin: 12px auto;
        }

        .price-box {
            background: rgba(255,215,0,0.08);
            border: 2px solid rgba(255,215,0,0.3);
            border-radius: 25px;
            padding: 20px;
            margin: 15px 0;
        }
        .price {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 56px;
            color: #ffd700;
            text-shadow: 0 0 40px rgba(255,215,0,0.5);
        }
        .price span { font-size: 24px; }
        .price-old {
            font-size: 16px;
            color: #665500;
            text-decoration: line-through;
            margin-top: 5px;
        }
        .saving {
            display: inline-block;
            background: #ffd700;
            color: #000;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 900;
            margin-top: 8px;
        }

        .features {
            text-align: left;
            margin: 15px 0;
        }
        .feature {
            font-size: 13px;
            color: #ffd700;
            padding: 6px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .feature span { font-size: 18px; }

        .pay-btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #ffd700, #ffaa00, #ffd700);
            background-size: 200% 200%;
            color: #000;
            border: none;
            border-radius: 25px;
            padding: 18px;
            font-family: 'Montserrat', sans-serif;
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
            margin: 15px 0 10px;
            box-shadow: 0 10px 40px rgba(255,215,0,0.5);
            letter-spacing: 2px;
            animation: btnShine 2s linear infinite;
        }
        @keyframes btnShine {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }
        .pay-btn:active { transform: scale(0.96); }

        .secure-text { font-size: 10px; color: #665500; margin: 8px 0; }
        .back-link { color: #ffd700; text-decoration: none; font-size: 13px; display: block; margin-top: 15px; opacity: 0.7; }
    </style>
</head>
<body>
    <div class="golden-rain" id="goldenRain"></div>

    <div class="container">
        <div class="card">
            <div class="crown-large">👑</div>
            <div class="badge">👑 PREMIUM</div>
            <div class="title">Королева тестов</div>
            <div class="subtitle">✨ навсегда ✨</div>
            <div class="divider"></div>

            <div class="price-box">
                <div class="price">499<span>₽</span></div>
                <div class="price-old">999₽</div>
                <div class="saving">💎 Скидка 50%</div>
            </div>

            <div class="features">
                <div class="feature"><span>👑</span> Статус Королевы навсегда</div>
                <div class="feature"><span>♾️</span> Безлимитные тесты</div>
                <div class="feature"><span>🎓</span> Золотые дипломы</div>
                <div class="feature"><span>📊</span> Все ответы подруг</div>
                <div class="feature"><span>👥</span> Битвы до 10 подруг</div>
                <div class="feature"><span>💬</span> Чат после битвы</div>
                <div class="feature"><span>⭐</span> Бейдж в профиле</div>
                <div class="feature"><span>🎁</span> Приоритетная поддержка</div>
            </div>

            <button class="pay-btn" onclick="goToPayment()">
                👑 СТАТЬ КОРОЛЕВОЙ — 499₽
            </button>

            <div class="secure-text">🔒 Безопасный платёж через ЮKassa</div>
            <a href="https://t.me/PodrugaTestBot" class="back-link">← Вернуться в бот</a>
        </div>
    </div>

    <script>
        // Золотой дождь
        const goldEmojis = ['🪙','✨','⭐','💛','👑','💎','🌟','💫'];
        const rain = document.getElementById('goldenRain');
        for(let i=0;i<40;i++){
            const d=document.createElement('span');
            d.className='gold-drop';
            d.textContent=goldEmojis[Math.floor(Math.random()*goldEmojis.length)];
            d.style.left=Math.random()*100+'%';
            d.style.animationDelay=Math.random()*3+'s';
            d.style.fontSize=(14+Math.random()*20)+'px';
            rain.appendChild(d);
        }

        function goToPayment() {
            const shopId = 'ВАШ_SHOP_ID';
            const userId = new URLSearchParams(window.location.search).get('user_id') || '0';
            window.location.href = `https://yoomoney.ru/quickpay/confirm?receiver=${shopId}&sum=499&label=forever_${userId}_365&successURL=https://t.me/PodrugaTestBot`;
        }
    </script>
</body>
</html>
